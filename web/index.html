<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客诉内部处理表</title>
<style>
  :root {
    --primary: #2b579a;
    --primary-hover: #1f3f6e;
    --primary-light: #eef4ff;
    --ai: #2b579a;
    --gao: #c55a11;
    --success: #1f6e43;
    --warning: #e67e22;
    --error: #c0392b;
    --text-primary: #262626;
    --text-secondary: #595959;
    --text-tertiary: #8c8c8c;
    --border: #e5e6eb;
    --border-light: #f2f3f5;
    --bg-page: #f5f6fa;
    --bg-card: #ffffff;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.03);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
    --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 8px;
  }
  * { box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    margin: 0;
    background: var(--bg-page);
    color: var(--text-primary);
    font-size: 13px;
    line-height: 1.5;
  }
  .top {
    background: linear-gradient(90deg, #2b579a, #1f3f6e);
    color: #fff;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    box-shadow: var(--shadow-md);
  }
  .top h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.2px; }
  .stats { font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .stats b { color: #ffd666; font-weight: 600; }

  .syncbar {
    padding: 8px 16px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-light);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    font-size: 11px;
  }
  .syncbar .grp {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-page);
    padding: 5px 9px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
  }
  .syncbar input[type=number] {
    width: 78px;
    padding: 5px 7px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 11px;
  }
  .syncbar input[type=number]:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(22,119,255,0.1);
  }
  .syncbar button {
    padding: 5px 12px;
    background: var(--primary);
    color: #fff;
    border: 0;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 11px;
    transition: all 0.2s;
  }
  .syncbar button:hover { background: var(--primary-hover); }
  .syncbar button.alt {
    background: var(--bg-card);
    color: var(--primary);
    border: 1px solid var(--primary);
  }
  .syncbar button.alt:hover {
    background: var(--primary-light);
  }

  .dingbar {
    padding: 7px 16px;
    background: #f6ffed;
    border-bottom: 1px solid #d9f7be;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    font-size: 13px;
  }
  .dingbar .dgrp { display: flex; align-items: center; gap: 8px; }
  .dingbar button {
    padding: 5px 12px;
    border: 1px solid var(--primary);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 11px;
    background: var(--bg-card);
    color: var(--primary);
    transition: all 0.2s;
  }
  .dingbar button:hover { background: var(--primary-light); }
  .dingbar button.ding-out { border-color: var(--error); color: var(--error); }
  .dingbar button.ding-out:hover { background: #fff1f0; }
  .dingbar button.ding-switch { border-color: var(--text-tertiary); color: var(--text-tertiary); }
  .dingbar button.ding-switch:hover { background: var(--bg-page); }
  .dingbar label { font-size: 12px; cursor: pointer; color: var(--text-secondary); }

  .syncmsg { padding: 6px 20px; font-size: 13px; color: var(--success); font-weight: 500; }

  .filters {
    padding: 8px 16px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-light);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filters select, .filters input {
    padding: 5px 9px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    background: var(--bg-card);
    color: var(--text-primary);
  }
  .filters select:focus, .filters input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(22,119,255,0.1);
  }
  .filters button {
    padding: 6px 16px;
    background: var(--primary);
    color: #fff;
    border: 0;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .filters button:hover { background: var(--primary-hover); }
  .filters button.alt {
    background: var(--bg-card);
    color: var(--primary);
    border: 1px solid var(--primary);
  }
  .filters button.alt:hover { background: var(--primary-light); }

  .pager { padding: 8px 20px; font-size: 13px; color: var(--text-tertiary); }
  .pager button {
    margin-left: 8px;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg-card);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 11px;
  }
  .pager button:hover { border-color: var(--primary); color: var(--primary); }

  .wrap {
    padding: 8px 10px 12px;
    overflow-x: hidden;
    overflow-y: visible;
    max-width: 100vw;
    background: var(--bg-page);
  }
  table {
    width: 100%;
    min-width: 0;
    border-collapse: collapse;
    background: var(--bg-card);
    font-size: 10.5px;
    table-layout: fixed;
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  th, td {
    border: 1px solid var(--border-light);
    padding: 4px 3px;
    text-align: left;
    vertical-align: top;
    overflow: hidden;
  }
  th {
    background: var(--bg-page);
    position: sticky;
    top: 0;
    z-index: 2;
    white-space: nowrap;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
  }
  td.info { white-space: pre-line; line-height: 1.35; font-size: 10px; word-break: break-word; color: var(--text-secondary); }
  td.cat { font-weight: 600; white-space: normal; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }

  tr.special td { background: #fffbe6; }
  tr.not_found td { background: #fff7e6; }
  tr.not_found td.period { background: #ffe7ba; font-weight: 600; color: #d46b08; }
  tr.filled td { background: #f6ffed; }
  tr.nf_wait td { background: #fffbe6; }
  tr.srcfilled td { background: #e6fffb; }

  .badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 10px;
    color: #fff;
    font-size: 10px;
    font-weight: 500;
    line-height: 1.4;
  }
  .badge.ai { background: var(--ai); }
  .badge.gao { background: var(--gao); }
  .badge.src { background: var(--success); }

  .procbtn {
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 11px;
    cursor: pointer;
    background: var(--bg-card);
    color: var(--text-secondary);
    transition: all 0.2s;
  }
  .procbtn:hover { border-color: var(--primary); color: var(--primary); }
  .procbtn.yes {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .procbtn.yes:hover { background: var(--primary-hover); }

  .reqbtn {
    padding: 4px 10px;
    border: 1px solid var(--primary);
    border-radius: var(--radius-sm);
    font-size: 11px;
    cursor: pointer;
    background: var(--bg-card);
    color: var(--primary);
    white-space: nowrap;
    transition: all 0.2s;
  }
  .reqbtn:hover { background: var(--primary); color: #fff; }
  .reqbtn:disabled {
    background: var(--bg-page);
    border-color: var(--border);
    color: var(--text-tertiary);
    cursor: not-allowed;
  }

  .order { font-family: Consolas, "SF Mono", monospace; font-size: 10.5px; word-break: break-all; color: var(--text-secondary); }

  .fb {
    width: 100%;
    min-height: 22px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    font-size: 11px;
    resize: none;
    background: transparent;
    font-family: inherit;
    padding: 3px;
    transition: all 0.2s;
  }
  .fb:hover { border-color: var(--border); }
  .fb:focus {
    border-color: var(--primary);
    background: var(--bg-card);
    outline: none;
    box-shadow: 0 0 0 2px rgba(22,119,255,0.1);
  }

  .rmk {
    width: 100%;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 11px;
    transition: all 0.2s;
  }
  .rmk:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(22,119,255,0.1);
  }

  .copyable { cursor: pointer; transition: background 0.2s; }
  .copyable:hover { background: var(--primary-light); }

  .talkcell { cursor: pointer; transition: background 0.2s; }
  .talkcell:hover { background: var(--primary-light); }

  .tk { white-space: pre-line; line-height: 1.45; font-size: 11px; word-break: break-word; }
  .tk .t-talk { color: var(--success); font-weight: 500; }
  .talk-wrap { display: flex; align-items: flex-start; gap: 6px; }
  .tkwrap { flex: 1 1 auto; }

  .genbtn {
    flex: 0 0 auto;
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg-page);
    color: var(--text-tertiary);
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .genbtn:hover { border-color: var(--primary); color: var(--primary); }
  .genbtn.on { background: var(--success); color: #fff; border-color: var(--success); }

  .dingcell { font-size: 12px; line-height: 1.5; text-align: center; }

  .dbtn {
    padding: 3px 8px;
    border: 1px solid var(--primary);
    border-radius: var(--radius-sm);
    background: var(--primary);
    color: #fff;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .dbtn:hover { background: var(--primary-hover); }
  .dbtn:disabled {
    background: var(--text-tertiary);
    border-color: var(--text-tertiary);
    color: #fff;
    cursor: not-allowed;
  }

  .talkcell .dingbtn { display: none; }
  .dingbtn {
    padding: 3px 8px;
    border: 1px solid var(--primary);
    border-radius: var(--radius-sm);
    background: var(--primary);
    color: #fff;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .dingbtn:hover { background: var(--primary-hover); }
  .dingbtn.sent { background: var(--text-tertiary); border-color: var(--text-tertiary); }

  .delbtn {
    padding: 2px 6px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg-card);
    color: var(--error);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    line-height: 1.4;
    transition: all 0.2s;
  }
  .delbtn:hover { background: var(--error); color: #fff; border-color: var(--error); }

  .selbox { width: 16px; height: 16px; cursor: pointer; accent-color: var(--primary); }

  .selbar {
    display: none;
    padding: 8px 20px;
    background: var(--primary-light);
    border-bottom: 1px solid #bae0ff;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }
  .selbar.show { display: flex; }
  .selbar button {
    padding: 5px 12px;
    border: 1px solid var(--primary);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 11px;
    background: var(--bg-card);
    color: var(--primary);
    transition: all 0.2s;
  }
  .selbar button:hover { background: var(--primary-light); }
  .selbar button.primary { background: var(--primary); color: #fff; }
  .selbar button.primary:hover { background: var(--primary-hover); }
  .selbar button.danger { border-color: var(--error); color: var(--error); }
  .selbar button.danger:hover { background: #fff1f0; }
  .selbar .selcnt { font-weight: 600; color: var(--primary); }

  .genbtn-all {
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg-page);
    color: var(--text-tertiary);
    font-size: 11px;
    cursor: pointer;
    margin-left: 6px;
    vertical-align: middle;
    transition: all 0.2s;
  }
  .genbtn-all:hover { border-color: var(--primary); color: var(--primary); }
  .genbtn-all.on { background: var(--success); color: #fff; border-color: var(--success); }

  .footer {
    padding: 10px 20px;
    color: var(--text-tertiary);
    font-size: 11px;
    line-height: 1.6;
  }
  col.c-info { width: 19%; }
  col.c-cat { width: 5.5%; }
  col.c-fb { width: 9%; }
  col.c-sel { width: 2.2%; }
  col.c-sheet { width: 3%; }
  col.c-row { width: 4%; }
  col.c-date { width: 5.2%; }
  col.c-period { width: 5%; }
  col.c-phone { width: 6.2%; }
  col.c-tutor { width: 6%; }
  col.c-proc { width: 4.8%; }
  col.c-talk { width: 9%; }
  col.c-time { width: 5.6%; }
  col.c-remark { width: 5.3%; }
  col.c-action { width: 4.5%; }
  col.c-del { width: 1.5%; }

  .toast {
    position: fixed;
    background: var(--success);
    color: #fff;
    padding: 8px 16px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 500;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    box-shadow: var(--shadow-lg);
    white-space: nowrap;
    transform: translateX(-50%) translateY(-10px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 1100px) {
    body { font-size: 12px; }
    .top, .syncbar, .dingbar, .filters, .pager, .selbar, .footer { padding-left: 10px; padding-right: 10px; }
    .top { gap: 8px; }
    .top h1 { width: 100%; font-size: 15px; }
    .stats { font-size: 11px; gap: 6px; }
    .syncbar .grp { flex: 1 1 240px; justify-content: space-between; }
    .filters input { flex: 1 1 180px; min-width: 0; }
    .wrap { padding: 8px; }
    table { min-width: 0; font-size: 10px; }
    th, td { padding: 3px 2px; }
    col.c-info { width: 18%; }
    col.c-talk { width: 8%; }
    col.c-fb { width: 8%; }
  }
  @media (max-width: 640px) {
    .syncbar .grp, .dingbar .dgrp { flex: 1 1 100%; }
    .syncbar input[type=number], .filters select, .filters button { width: 100%; }
    .filters { align-items: stretch; }
    .filters select, .filters input, .filters button { flex: 1 1 100%; }
    .pager, .selbar { overflow-x: hidden; white-space: normal; }
    .wrap { padding: 6px 4px; }
  }

</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="top">
  <h1>客诉内部处理表</h1>
  <div class="stats" id="stats"></div>
</div>
<div id="siteLoginBanner" style="display:none;background:#fff1f0;border:1px solid #ffa39e;color:#cf1322;padding:8px 14px;border-radius:8px;margin:6px 12px;font-size:13px;font-weight:600;">
  ⚠ <span id="siteLoginMsg"></span>
  <button onclick="siteRelogin()" style="margin-left:10px;background:#ff4d4f;color:#fff;border:none;border-radius:6px;padding:4px 12px;cursor:pointer;font-weight:600;">一键重新登录站点</button>
</div>
<div id="tencentLoginBanner" style="display:none;background:#fff7e6;border:1px solid #ffd591;color:#ad4e00;padding:8px 14px;border-radius:8px;margin:6px 12px;font-size:13px;font-weight:600;">
  ⚠ <span id="tencentLoginMsg"></span>
  <button onclick="tencentLogin()" style="margin-left:10px;background:#ff9c2c;color:#fff;border:none;border-radius:6px;padding:4px 12px;cursor:pointer;font-weight:600;">重新扫码登录腾讯文档</button>
</div>
<div class="syncbar">
  <div class="grp"><span class="badge ai">AI表</span> 从第 <input type="number" id="aiStart" min="3" placeholder="如 10880"> 行及以下 <button id="btnSyncAI" onclick="doSync('AI')">同步并查询</button></div>
  <div class="grp"><span class="badge gao">高表</span> 从第 <input type="number" id="gaoStart" min="3" placeholder="如 2707"> 行及以下 <button id="btnSyncGao" onclick="doSync('高')">同步并查询</button></div>
  <div class="grp"><button class="alt" onclick="doQuery()">查询补全(当前表)</button></div>
  <div class="grp"><button class="alt" id="btnBatchAI" onclick="batchFill('AI')">批量回填(AI表)</button></div>
  <div class="grp"><button class="alt" id="btnBatchGao" onclick="batchFill('高')">批量回填(高表)</button></div>
  </div>
<div class="dingbar">
  <span id="dingStatus" style="font-size:11px;font-weight:600;">钉钉：加载中...</span>
  <div class="dgrp">
    <button onclick="dingLogin()">登录</button>
    <button onclick="dingLogout()" class="ding-out">退出</button>
    <button onclick="dingSwitchAccount()" class="ding-switch">切换账号</button>
  </div>
  <div class="dgrp" style="margin-left:6px;">
    <button onclick="tencentLogin()" title="在本页面显示二维码，手机扫码登录腾讯文档客诉表">腾讯文档登录</button>
  </div>
  <div class="dgrp">
    <button onclick="dingSendSelected()" style="background:transparent;color:#1677ff;border-color:#1677ff;">发送选中</button>
  </div>
  <label style="font-size:11px;cursor:pointer;"><input type="checkbox" id="dingAuto" onchange="dingAutoSave()"> 回填后自动发钉钉</label>
  <div class="dgrp" style="margin-left:12px;">
    <button class="alt" onclick="batchSendDingtalk()" title="批量发送未发/失败的单：二转发群，单聊发个人">批量发送钉钉</button>
    <button class="alt" onclick="load(PAGE,true)">刷新列表</button>
    <button onclick="resetTable()" style="background:#ff4d4f;color:#fff;border-color:#ff4d4f;">重置</button>
  </div>
</div>
<div class="syncbar" style="background:#fff;border-top:none">
<div class="syncmsg" id="syncmsg"></div>
<div class="filters">
  <select id="fSheet"><option value="AI" selected>AI表</option><option value="高">高表</option></select>
  <select id="fStatus"><option value="">全部状态</option><option value="pending">待补全</option><option value="nf_wait">复核中</option><option value="filled">已补全</option><option value="special">特殊单</option><option value="not_found">系统未掉落</option></select>
  <select id="fProcessed"><option value="">全部处理</option><option value="是">已处理(是)</option><option value="否">未处理</option></select>
  <input id="fQ" placeholder="搜索 订单号/内容/诉求">
  <button onclick="load(0)">查询</button>
  <span id="count" style="color:#888;font-size:12px"></span>
</div>
<div class="pager" id="pager"></div>
<div class="selbar" id="selbar"><span>已选 <span class="selcnt" id="selcnt">0</span> 条</span><button onclick="batchProcessSelected()" class="primary">标记已处理</button><button onclick="querySelected()">补全选中</button><button onclick="writebackSelected()" title="把选中记录的期次/手机号/顾问逐格写入腾讯文档源表并校验">回填选中</button><button onclick="dingSendSelected()">批量发钉钉</button><button onclick="batchDeleteSelected()" class="danger">批量删除</button><button onclick="clearSelection()">取消选择</button></div>
<div class="wrap">
  <table>
    <colgroup>
      <col class="c-sel"><col class="c-sheet"><col class="c-row"><col class="c-date"><col class="c-info"><col class="c-cat">
      <col class="c-period"><col class="c-phone"><col class="c-tutor"><col class="c-proc"><col class="c-talk"><col class="c-time">
      <col class="c-remark"><col class="c-fb"><col class="c-action"><col class="c-action"><col class="c-del">
    </colgroup>
    <thead><tr>
      <th><input type="checkbox" class="selbox" id="selAll" onclick="toggleSelectAll(this)" title="全选/取消全选"></th><th>表</th><th>源表行</th><th>反馈时间</th><th>客户信息及反馈</th><th>问题归类</th>
      <th>期次</th><th>手机号</th><th>顾问</th><th>是否处理</th><th>话术 <button id="genAllBtn" class="genbtn-all" onclick="toggleTalkGenAll(this)" title="批量生成/撤销全部话术">生成</button></th><th>处理时间</th><th>备注</th><th>顾问反馈</th><th>回写源表</th><th>钉钉</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const CAT_COLORS = { "未收到通知":"#fa8c16","正价退费纠纷":"#fa8c16","投诉助教服务":"#fa8c16","更换通知方式":"#fa8c16","承诺资料未给":"#f5222d","用户主动添加不成功":"#13c2c2" };
let PAGE = 0; const PAGE_SIZE = 300;
	const _dingSent = new Set(); // 已发送钉钉的行ID
let syncing = false;

	// ---------- 勾选框 / 批量选择 ----------
	function toggleSelectAll(el) {
	  document.querySelectorAll('.selbox').forEach(cb => { if (cb.id !== 'selAll') cb.checked = el.checked; });
	  updateSelBar();
	}
	function onSelChange() {
	  const all = document.querySelectorAll('.selbox:not(#selAll)');
	  const checked = document.querySelectorAll('.selbox:not(#selAll):checked');
	  const selAll = document.getElementById('selAll');
	  if (selAll) { selAll.checked = checked.length === all.length && all.length > 0; selAll.indeterminate = checked.length > 0 && checked.length < all.length; }
	  updateSelBar();
	}
	function updateSelBar() {
	  const ids = dingSelectedIds();
	  const bar = document.getElementById('selbar');
	  const cnt = document.getElementById('selcnt');
	  if (cnt) cnt.textContent = ids.length;
	  if (bar) bar.classList.toggle('show', ids.length > 0);
	}
	function clearSelection() {
	  document.querySelectorAll('.selbox:checked').forEach(cb => { cb.checked = false; });
	  const selAll = document.getElementById('selAll');
	  if (selAll) { selAll.checked = false; selAll.indeterminate = false; }
	  updateSelBar();
	}
	async function batchProcessSelected() {
	  const ids = dingSelectedIds();
	  if (!ids.length) { showToast('请先勾选记录', '#888'); return; }
	  if (!confirm('将 ' + ids.length + ' 条选中记录标记为"已处理"？')) return;
	  let ok = 0;
	  for (const id of ids) {
	    try {
	      await fetch('/api/process', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id, processed:'是'}) });
	      ok++;
	    } catch(e) {}
	  }
	  showToast('已标记 ' + ok + ' 条为已处理');
	  clearSelection();
	  load(PAGE, true);
	}
	async function batchDeleteSelected() {
	  const ids = dingSelectedIds();
	  if (!ids.length) { showToast('请先勾选记录', '#888'); return; }
	  if (!confirm('确定要删除 ' + ids.length + ' 条选中记录？此操作不可撤销。')) return;
	  try {
	    const r = await fetch('/api/delete-batch', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ids}) });
	    const d = await r.json();
	    showToast('已删除 ' + d.deleted + ' 条', d.deleted > 0 ? '#1f6e43' : '#ff4d4f');
	  } catch(e) {
	    showToast('删除失败', '#ff4d4f');
	  }
	  clearSelection();
	  load(PAGE, true);
	}
	async function queryOne(el) {
	  const id = Number(el.dataset.id);
	  el.disabled = true;
	  try {
	    await fetch('/api/query-one', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id}) });
	    showToast('已提交补全', null, el);
	    setMsg('正在补全该行...（自动刷新中）', '#1677ff');
	    startPoll();
	  } catch(e) {
	    showToast('补全失败: ' + e.message, '#ef4444');
	    el.disabled = false;
	  }
	}
	async function querySelected() {
	  const ids = dingSelectedIds();
	  if (!ids.length) { showToast('请先勾选记录', '#888'); return; }
	  if (!confirm('将补全 ' + ids.length + ' 条选中记录？')) return;
	  try {
	    await fetch('/api/query-batch', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ids}) });
	    showToast('已提交补全 ' + ids.length + ' 条');
	    setMsg('正在补全 ' + ids.length + ' 条...（自动刷新中）', '#1677ff');
	    startPoll();
	    clearSelection();
	  } catch(e) {
	    showToast('补全失败: ' + e.message, '#ef4444');
	  }
	}
	async function writebackSelected() {
	  const ids = dingSelectedIds();
	  if (!ids.length) { showToast('请先勾选记录', '#888'); return; }
	  if (syncing) { setMsg('已有操作进行中，请稍候...', '#ff4d4f'); return; }
	  if (!confirm('将 ' + ids.length + ' 条选中记录回填到腾讯文档源表？\n（逐格写入期次/手机号/顾问并逐格校验，约每条 5-10 秒）')) return;
	  syncing = true;
	  $("btnSyncAI").disabled = true; $("btnSyncGao").disabled = true;
	  setMsg('回填选中 ' + ids.length + ' 条：定位+写入+校验中...', '#1677ff');
	  try {
	    const r = await fetch('/api/writeback-selected', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ids}) });
	    const d = await r.json();
	    if (!d.ok || !d.async) { setMsg('回填选中启动失败：' + (d.reason || '未知'), '#ff4d4f'); syncing = false; enableBtns(); return; }
	    await pollSelectedResult();
	  } catch(e) {
	    setMsg('回填选中请求失败: ' + e.message, '#ff4d4f');
	    syncing = false; enableBtns();
	  }
	}
	async function pollSelectedResult() {
	  // 上限 30 分钟：任务可能排在批量回填/自动回写等长任务后面排队
	  for (let i = 0; i < 600; i++) {
	    await new Promise(r => setTimeout(r, 3000));
	    try {
	      const st = await (await fetch('/api/status')).json();
	      if (st.lastPhase !== 'selected') continue;
	      if (st.running) { setMsg('回填选中进行中...（已等待 ' + ((i+1)*3) + ' 秒）', '#1677ff'); continue; }
	      const res = st.lastResult;
	      if (!res) { if ((i+1)*3 < 15) continue; setMsg('回填选中完成但无结果，请看服务端日志', '#ff4d4f'); break; }
	      if (res.ok) {
	        setMsg('✓ 回填选中成功：' + (res.okCount || 0) + ' 条已写入源表' + (res.failCount ? '（另有 ' + res.failCount + ' 条失败，见列表回写列）' : ''), '#1f6e43');
	        load(0, true); startPoll();
	      } else {
	        setMsg('✗ 回填选中' + (res.okCount ? '部分失败' : '失败') + '：' + (res.reason || ((res.failCount || 0) + ' 条失败，见列表回写列')), '#ff4d4f');
	        load(0, true);
	      }
	      break;
	    } catch(e) { /* 轮询失败，继续 */ }
	  }
	  syncing = false; enableBtns();
	}

async function stats() {
  try { await checkSiteLogin(); } catch(e) {}
  try {
    const d = await (await fetch("/api/stats")).json();
    const map = {}; d.status.forEach(s=>map[s.query_status]=s.n);
    const pmap = {}; d.processed.forEach(s=>pmap[s.processed]=s.n);
    const ss = d.syncState || {};
    let syncInfo = "";
    if (ss.AI && ss.AI.lastRow) syncInfo += ` | AI已同步到 ${ss.AI.lastRow} 行`;
    if (ss["高"] && ss["高"].lastRow) syncInfo += ` | 高已同步到 ${ss["高"].lastRow} 行`;
    $("stats").innerHTML = `共 <b>${d.total}</b> 条 | 待补全 <b>${map.pending||0}</b> | 已补全 <b>${map.filled||0}</b> | 特殊 <b>${map.special||0}</b> | 未掉落 <b>${map.not_found||0}</b> | 已处理 <b>${pmap["是"]||0}</b> | 钉钉已发 <b>${d.dingSent||0}</b> | 过滤 <b>${d.dingFiltered||0}</b> | 失败 <b>${d.dingFail||0}</b><span style="color:#cfe0ff">${syncInfo}</span>`;

function qs() {

  if ($("fSheet").value) p.set("sheet", $("fSheet").value);
  if ($("fStatus").value) p.set("status", $("fStatus").value);
  if ($("fProcessed").value) p.set("processed", $("fProcessed").value);
  if ($("fQ").value.trim()) p.set("q", $("fQ").value.trim());
  p.set("limit", String(PAGE_SIZE)); p.set("offset", String(PAGE * PAGE_SIZE));
  const s = p.toString();

}
let TALK_CFG = null;
async function loadTalkCfg() {
  try { const r = await fetch("/api/config", { cache: "no-store" }); TALK_CFG = await r.json(); } catch (e) { TALK_CFG = {}; }
}
function extractCourse(ci) {
  const lines = String(ci || "").split(/\n+/).map(s => s.trim()).filter(Boolean);
  const re = /(升初一|升初二|升初三|升高一|升高二|升高三|老梦|梦亚|果冻|清北|初一|初二|初三|高一|高二|高三|长期|短期|寒假|暑假|春季|秋季)/;
  const hit = lines.find(l => re.test(l) && !/^\d+$/.test(l) && !/\d{10,}/.test(l));
  return hit ? hit.replace(/\+$/, "").trim() : "";
}
function extractNewContact(ci) {
  const s = String(ci || "");
  const m = s.match(/更换通知方式\s*(\d{6,})/) || s.match(/通知\s*(\d{6,})/);
  return m ? m[1] : "";
}
// 通用提取 11 位手机号（1[3-9] 开头、前后非数字——19 位订单号不会误匹配），取最后一个匹配
function extractPhoneFromText(ci) {
  const ms = [...String(ci || "").matchAll(/(?<!\d)1[3-9]\d{9}(?!\d)/g)];
  return ms.length ? ms[ms.length - 1][0] : "";
}
function extractProblem(ci) {
  const lines = String(ci || "").split(/\n+/).map(s => s.trim()).filter(Boolean);
  const last = lines[lines.length - 1] || "";
  return last.replace(/\+$/, "").trim();
}
function talkBlock(row) {
  const st = row.query_status || "";
  const cat = row.category || "";
  const remark = row.query_remark || "";
  const period = row.fill_period || row.src_period || "";
  const phone = row.fill_phone || row.src_phone || "";
  const tutor = row.fill_tutor || row.src_tutor || "";
  const isNotFound = st === "not_found" || period === "系统未掉落";
  const isSpecial = st === "special" || remark.includes("爱芯过滤") || remark.includes("正价课拦截") || cat.includes("爱芯过滤") || cat.includes("正价课拦截");
  // 无具体助教（未掉落/过滤/正价课拦截/空助教）或缺期次/电话 → 不需要话术
  if (isNotFound || isSpecial || !tutor || !period || !phone) return "";
  const course = extractCourse(row.customer_info);
  const oldNote = (TALK_CFG && TALK_CFG.periodRule && TALK_CFG.periodRule.oldNote) || "二转";
  const isSecond = tutor === oldNote;
  const tmpl = (TALK_CFG && TALK_CFG.talkScripts || {})[cat];
  let periodLine = period;
  let talk;
  if (isSecond) {
    // 二转话术 = 客户信息里客服提交的具体问题 + 空格 + 二转（如：未收到通知 二转）
    const problem = extractProblem(row.customer_info) || cat;
    talk = problem + " " + oldNote;
  } else if (tmpl) {
    let newContact = extractNewContact(row.customer_info);
    // 更换联系方式类：C 列没匹配到"更换通知方式XXX"格式时，从文本通用提取 11 位手机号
    // （客服常写"联系151xxxx"，窄正则抓不到会静默回退哆啦号）填入 {新联系方式}；
    // 提取不到或与登记电话一致 → 期次行标注（电话无误）；第二行显示始终保留哆啦号
    if (cat === "更换通知方式" || cat === "更换联系方式") {
      if (!newContact) newContact = extractPhoneFromText(row.customer_info);
      if (!newContact || newContact === phone) {
        periodLine = period + "（电话无误）";
        newContact = phone;
      }
    }
    talk = String(tmpl)
      .replace(/\{期次\}/g, period)
      .replace(/\{电话\}/g, phone)
      .replace(/\{手机号\}/g, phone)
      .replace(/\{课程\}/g, course)
      .replace(/\{新联系方式\}/g, newContact);
  } else {
    return "";  // 少见分类无模板 → 留空，人工处理
  }
  // 期次/电话/话术 必有；课程缺失则省略课程行
  let html = esc(periodLine) + '<br>' + esc(phone);
  if (course) html += '<br>' + esc(course);
  html += '<br><span class="t-talk">' + esc(talk) + '</span>';
  return '<div class="tk">' + html + '</div>';
}

function copyText(text, el) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:0;left:0;width:2px;height:2px;padding:0;border:none;outline:none;box-shadow:none;background:transparent;z-index:9999";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, 99999);
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  if (ok) { showToast("已复制", null, el); }
  else { showToast("复制失败，请手动选择复制", "#ef4444", el); }
}

function copyCell(el) { copyText((el.innerText || "").trim(), el); }
function copyTalk(el) {
  const tk = el.querySelector(".tk");
  const wrap = el.querySelector(".tkwrap");
  if (!tk || (wrap && getComputedStyle(wrap).display === "none")) { setMsg("请先点'生成'再复制话术", "#ff4d4f"); return; }
  copyText((tk.innerText || "").trim(), el);
}
async function sendToDingtalk(id) {
	  const rows = window._kehuRows || [];
	  const row = rows.find(r => r.id === id);
	  if (!row) return;
	  const isNotFound = row.query_status === "not_found" || (row.fill_period || row.src_period || "") === "系统未掉落";
	  const isSpecial = row.query_status === "special" || (row.query_remark || "").includes("爱芯过滤") || (row.query_remark || "").includes("正价课拦截") || (row.category || "").includes("爱芯过滤") || (row.category || "").includes("正价课拦截");
	  if (isNotFound || isSpecial) { showToast("无需发送", "#ef4444"); return; }
	  const period = row.fill_period || row.src_period || "";
	  const phone = row.fill_phone || row.src_phone || "";
	  const tutor = row.fill_tutor || row.src_tutor || "";
	  if (!tutor || !period || !phone) { showToast("信息不完整，无法发送", "#ef4444"); return; }
	  const oldNote = (TALK_CFG && TALK_CFG.periodRule && TALK_CFG.periodRule.oldNote) || "二转";
	  const isSecond = tutor === oldNote;
	  let talk;
	  if (isSecond) {
	    const problem = extractProblem(row.customer_info) || row.category;
	    talk = problem + " " + oldNote;
	  } else {
	    const tmpl = (TALK_CFG && TALK_CFG.talkScripts || {})[row.category];
	    if (!tmpl) { showToast("无话术模板", "#ef4444"); return; }
	    const course = extractCourse(row.customer_info);
	    let newContact = extractNewContact(row.customer_info);
	    // 同 talkBlock：C 列通用提取 11 位手机号填 {新联系方式}，第二行显示仍保留哆啦号
	    if (row.category === "更换通知方式" || row.category === "更换联系方式") {
	      if (!newContact) newContact = extractPhoneFromText(row.customer_info);
	      if (!newContact || newContact === phone) newContact = phone;
	    }
	    talk = String(tmpl).replace(/\{期次\}/g, period).replace(/\{电话\}/g, phone).replace(/\{手机号\}/g, phone).replace(/\{课程\}/g, course).replace(/\{新联系方式\}/g, newContact);
	  }
	  const course = extractCourse(row.customer_info);
	  let lines = [period, phone];
	  if (course) lines.push(course);
	  lines.push(talk);
	  const text = "## 客诉转办\n\n" + lines.map(l => "- " + l).join("\n");
	  try {
	    const r = await fetch("/api/send-dingtalk", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({text, id: row.id}) });
	    const d = await r.json();
	    if (d.ok) { showToast("已发送到群"); _dingSent.add(id); markSent(id); }
	    else { showToast("发送失败: " + (d.error || "未知"), "#ef4444"); }
	  } catch (e) { showToast("发送失败: " + e.message, "#ef4444"); }
	}
	function markSent(id) { const b = document.querySelector('.dingbtn[data-id="' + id + '"]'); if (b) b.classList.add('sent'); }
	async function batchSendDingtalk() {
	  const rows = window._kehuRows || [];
	  const oldNote = (TALK_CFG && TALK_CFG.periodRule && TALK_CFG.periodRule.oldNote) || "二转";
	  // 与勾选发送同一套规则：二转发群（webhook），单聊发个人（notify.js）
	  const targets = rows.filter(r => {
	    if (r.is_blank || r.query_status === "blank") return false;
	    const tutor = r.fill_tutor || r.src_tutor || "";
	    if (!tutor) return false;
	    const st = r.ding_status || "";
	    if (st === "ok" || st === "sending") return false;
	    if (_dingSent.has(r.id)) return false;
	    return true;
	  });
	  if (!targets.length) { showToast("没有待发送的记录", "#888"); return; }
	  const secondRows = targets.filter(r => (r.fill_tutor || r.src_tutor || "") === oldNote);
	  const singleRows = targets.filter(r => (r.fill_tutor || r.src_tutor || "") !== oldNote
	    && (r.fill_period || r.src_period) && (r.fill_phone || r.src_phone));
	  const incomplete = targets.length - secondRows.length - singleRows.length;
	  if (!confirm("将发送 " + targets.length + " 条：二转 " + secondRows.length + " 条发群、单聊 " + singleRows.length + " 条发个人"
	    + (incomplete ? "（另有 " + incomplete + " 条单聊信息不完整跳过）" : "") + "，是否继续？")) return;
	  showToast("正在发送 " + targets.length + " 条…", "#1677ff");
	  let ok = 0, fail = 0;
	  for (const row of secondRows) {
	    try {
	      const period = row.fill_period || row.src_period || "";
	      const phone = row.fill_phone || row.src_phone || "";
	      const problem = extractProblem(row.customer_info) || row.category;
	      const talk = problem + " " + oldNote;
	      const course = extractCourse(row.customer_info);
	      let lines = [period, phone];
	      if (course) lines.push(course);
	      lines.push(talk);
	      const text = "## 客诉转办\n\n" + lines.map(l => "- " + l).join("\n");
	      const r = await fetch("/api/send-dingtalk", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({text, id: row.id}) });
	      const d = await r.json();
	      if (d.ok) { ok++; _dingSent.add(row.id); markSent(row.id); }
	      else { fail++; }
	    } catch (e) { fail++; }
	  }
	  if (singleRows.length) {
	    if (!DING_CFG.available) { showToast("未安装 dws，单聊未发送", "#ef4444"); }
	    else {
	      try {
	        const singleIds = singleRows.map(r => r.id);
	        const r = await fetch("/api/ding/send", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ids:singleIds}) });
	        const d = await r.json();
	        if (d.ok) ok += singleRows.length; else fail += singleRows.length;
	      } catch (e) { fail += singleRows.length; }
	      startPoll();
	    }
	  }
	  showToast("发送完成: " + ok + " 条成功" + (fail ? ", " + fail + " 条失败" : "") + (incomplete ? ", " + incomplete + " 条跳过" : ""), ok ? "#1f6e43" : "#ef4444");
	}
	async function deleteRow(id) {
	  if (!confirm("确定删除此行？")) return;
	  try {
	    const r = await fetch("/api/delete", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({id}) });
	    const d = await r.json();
	    if (d.ok) { showToast("已删除"); load(PAGE, true); }

	  } catch (e) { showToast("删除失败: " + e.message, "#ef4444"); }
	}

}

}
function wbBadge(row) {
  const s = row.writeback_status || "";
  const at = row.writeback_at ? `<div style="font-size:10px;color:#aaa">${esc(row.writeback_at)}</div>` : "";

let fbTimer = {};
let pollTimer = null, quietPoll = 0;
let pollBaseDoneAt = null, pollBaseCaptured = false;   // 轮询开始时的 doneAt 快照：只有本次轮询期间
                             // 有任务真正跑完才显示"已完成"，否则服务端残留的 jobState 会让任何
                             // 操作 10 秒后都冒出上一次任务的旧消息
// 自动刷新轮询：同步/查询/回写进行中每5秒刷新一次列表，完成后显示"已完成"
async function pollStatus() {
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    const d = await r.json();
    if (!pollBaseCaptured) { pollBaseDoneAt = (d.doneAt === undefined ? null : d.doneAt); pollBaseCaptured = true; }
    const finishedNow = d.doneAt != null && d.doneAt !== pollBaseDoneAt;   // 本次轮询期间有任务真正跑完
    const filled = d.filled || 0, total = d.total || 0, pending = d.pending || 0;
    const records = d.records || total;                       // 只算真实记录，不算空白占位行
    const blanks = Math.max(0, total - records);
    if (d.running) {
      quietPoll = 0;
      if (d.type && d.type.indexOf("钉钉") >= 0) {
        const dp = d.dingProgress;
        if (dp && dp.total > 0) {
          setMsg(d.type + " 进行中… 已发送 " + Math.min(dp.done || 0, dp.total) + "/" + dp.total + "（自动刷新中）", "#1677ff");
        } else {
          setMsg(d.type + " 进行中…（自动刷新中）", "#1677ff");
        }
      } else {
        setMsg((d.type || "任务") + " 进行中… 已补全 " + filled + "/" + records + (blanks ? "（另有 " + blanks + " 行空白）" : "") + "（自动刷新中）", "#1677ff");
      }
      load(PAGE, true);
    } else if (d.dingRunning) {
      // 钉钉发送走独立并行队列，不再被浏览器任务阻塞；这里只显示进度不打断轮询
      quietPoll = 0;
      const dp = d.dingProgress;
      if (dp && dp.total > 0) {
        setMsg("钉钉发送中… 已发送 " + Math.min(dp.done || 0, dp.total) + "/" + dp.total + "（自动刷新中）", "#1677ff");
      } else {
        setMsg("钉钉发送中…（自动刷新中）", "#1677ff");
      }
      load(PAGE, true);
    } else {
      quietPoll++;
      if (quietPoll >= 2) {
        if (finishedNow) {
          if (d.type && d.type.indexOf("钉钉") >= 0) {
            setMsg("已完成：" + d.type, "#1f6e43");
          } else if (d.lastResult && d.lastResult.ok === false) {
            setMsg((d.type || "任务") + " 失败：" + (d.lastResult.reason || "未知原因"), "#ff4d4f");
            load(PAGE, true);
            stopPoll();
            syncing = false; $("btnSyncAI").disabled = false; $("btnSyncGao").disabled = false;
            return;
          } else {
            setMsg("已完成：" + (d.type || "任务") + "，已补全 " + filled + "/" + records + (blanks ? "（另有 " + blanks + " 行空白）" : "") + "，待补全 " + pending + (d.lastResult && d.lastResult.summary ? "（" + d.lastResult.summary + "）" : ""), "#1f6e43");
          }
        }
        load(PAGE, true);
        stopPoll();
        syncing = false; $("btnSyncAI").disabled = false; $("btnSyncGao").disabled = false;
      } else {
        load(PAGE, true);
      }
    }
  } catch (e) {}
}
function startPoll() {
  stopPoll(); quietPoll = 0; pollBaseDoneAt = null; pollBaseCaptured = false;
  pollStatus();   // 立即拍 doneAt 快照（否则快速任务在首个 5 秒 tick 前跑完会漏掉"已完成"提示）
  pollTimer = setInterval(pollStatus, 5000);

        setRefundMsg("✗ " + (res.error || "失败") + (res.needKeepAllocated ? "（把要保留的值填到「已分配保留值」后再点开始）" : ""), "#ff4d4f");
      }
      break;
    }
  } catch (e) {
    setRefundMsg("退款率分析失败: " + e.message, "#ff4d4f");
  }
  $("btnRefund").disabled = false;
}
async function pollBatchResult(sheet, phase) {
  const label = phase === "exec" ? "批量回填" : "批量检查";
  let elapsed = 0;
  // 上限 20 分钟：任务可能排在自动回写等长任务后面排队（回写 16 条实测要 5 分半）
  for (let i = 0; i < 400; i++) {
    await new Promise(r => setTimeout(r, 3000)); elapsed += 3;
    try {
      const sr = await fetch("/api/status");
      const st = await sr.json();
      if (st.lastPhase !== phase) continue; // 不是我们的结果
      if (st.batchQueued > 0) {
        setMsg(label + "排队中（前面有其他任务在执行）...已等待 " + elapsed + " 秒", "#b8860b");
        continue;
      }
      if (st.running) {
        setMsg(label + "进行中...（已等待 " + elapsed + " 秒）", "#1677ff");
        continue;
      }
      // 任务完成
      const res = st.lastResult;
      if (!res) { if (elapsed < 15) continue; setMsg(label + "完成但无结果", "#ff4d4f"); syncing = false; enableBtns(); return; }
      if (phase === "check") {
        if (res.ok) {
          // 核对通过（行号与订单号和源表一致）→ 不再弹窗确认，直接执行回填
          setMsg("核对通过：顶" + res.top + " / 中" + res.middle + " / 底" + res.bottom + " 行号与订单号均与源表一致（共 " + res.N + " 条记录），直接执行回填...", "#1f6e43");
          syncing = false; enableBtns();
          await batchFillExec(sheet);
          return;
        } else {
          setMsg("批量检查失败：" + (res.reason || "未知错误"), "#ff4d4f");
        }
      } else {
        if (res.ok) {
          setMsg("批量回填成功：已写入 " + (res.written || 0) + " 条记录（第" + res.top + "-" + res.bottom + " 行），末尾校验通过", "#1f6e43");
          load(0, true);
          startPoll();
        } else {
          setMsg("批量回填" + (res.rolledBack ? "失败但已撤销粘贴" : "未执行") + "：" + (res.reason || "未知原因"), "#ff4d4f");
        }
      }
      syncing = false; enableBtns();
      return;
    } catch (e) { /* 轮询失败，继续 */ }
  }
  setMsg(label + "超时（3分钟未完成），请刷新页面查看状态", "#ff4d4f");
  syncing = false; enableBtns();
}
async function batchFillExec(sheet) {
  syncing = true;
  $("btnSyncAI").disabled = true; $("btnSyncGao").disabled = true;
  if ($("btnBatchAI")) $("btnBatchAI").disabled = true;
  if ($("btnBatchGao")) $("btnBatchGao").disabled = true;
  setMsg((sheet === "AI" ? "AI表" : "高表") + " 批量回填执行中（粘贴+末尾校验，约需 60-90 秒）...", "#1677ff");
  try {
    const r = await fetch("/api/writeback-all", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({sheet, phase:"exec"}) });
    const d = await r.json();
    if (!d.async) { setMsg("批量回填启动失败：" + (d.reason || "未知"), "#ff4d4f"); syncing = false; enableBtns(); return; }
    await pollBatchResult(sheet, "exec");
  } catch (e) {
    setMsg("批量回填请求失败: " + e.message, "#ff4d4f");
    syncing = false; enableBtns();
  }
}

function tencentQrModal(show, inner) {

async function tencentPollQr() {
  try {
    const r = await fetch("/api/tencent/qrcode", { cache: "no-store" });
    const d = await r.json();
    const box = $("tencentQrBox"), msg = $("tencentQrMsg");
    if (!box) { tencentCloseQr(); return; }
    if (d.state === "done") {
      const already = d.message && String(d.message).includes("已登录");
      if (msg) msg.textContent = already ? "当前已登录，客诉表可后台查询/回填" : "登录成功！客诉表已可后台查询/回填";
      if (msg) msg.style.color = "#1f6e43";
      if (box) box.innerHTML = already
        ? '<div style="font-size:36px">✓</div><div style="margin-top:8px;color:#1f6e43;font-weight:600">当前已登录</div><div style="margin-top:6px;color:#888;font-size:12px">如需更换账号，请点下方「重新登录」</div>'
        : '<div style="font-size:40px">✓</div><div style="margin-top:8px;color:#1f6e43">登录成功</div>';
      setMsg(already ? "腾讯文档已登录" : "腾讯文档登录成功", "#1f6e43");
      return;
    }
    if (d.state === "error") {
      if (msg) { msg.textContent = d.message || "登录失败，请重试"; msg.style.color = "#ff4d4f"; }
      if (box) box.innerHTML = '<div style="color:#ff4d4f;padding:20px 0">' + (esc(d.message) || "登录失败") + '</div>';
      clearInterval(tencentPollTimer); tencentPollTimer = null;
      return;
    }
    if (d.qr) {
      if (box && box.dataset.qr !== d.qr) { box.dataset.qr = d.qr; box.innerHTML = '<img src="' + d.qr + '" style="width:240px;height:240px;border:1px solid #eee;border-radius:8px">'; }
      if (msg) { msg.textContent = "请用手机微信/QQ 扫码登录"; msg.style.color = "#1677ff"; }
    } else if (d.state === "starting") {
      if (box) box.textContent = "正在生成二维码…";
    }
  } catch (e) { /* 轮询中忽略网络抖动 */ }
}

async function dingSendOne(el) {
  const id = Number(el.dataset.id);

  const row = rows.find(r => r.id === id);
  if (!row) return;
  const tutor = row.fill_tutor || row.src_tutor || "";
  const oldNote = (TALK_CFG && TALK_CFG.periodRule && TALK_CFG.periodRule.oldNote) || "二转";
  const isSecond = tutor === oldNote;
  el.disabled = true;
  if (isSecond) {
    setMsg("正在发送二转群消息...", "#1677ff");
    try {
      const period = row.fill_period || row.src_period || "";
      const phone = row.fill_phone || row.src_phone || "";
      const problem = extractProblem(row.customer_info) || row.category;
      const talk = problem + " " + oldNote;
      const course = extractCourse(row.customer_info);
      let lines = [period, phone];
      if (course) lines.push(course);
      lines.push(talk);
      const text = "## 客诉转办\n\n" + lines.map(l => "- " + l).join("\n");
      const r2 = await fetch("/api/send-dingtalk", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({text, id}) });
      const d2 = await r2.json();
      if (d2.ok) { _dingSent.add(id); showToast("已发送到群"); }
      else { showToast("发送失败: " + (d2.error || "未知"), "#ef4444"); el.disabled = false; }

  } else {
    if (!DING_CFG.available) { setMsg("未安装 dws，请先安装", "#ff4d4f"); el.disabled = false; return; }
    setMsg("正在发送钉钉消息...", "#1677ff");
    try {
      const r2 = await fetch("/api/ding/send", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ids:[id]}) });
      const d2 = await r2.json();
      setMsg(d2.message || "已加入发送队列", "#1f6e43");
    } catch (e) { setMsg("发送请求失败: " + e.message, "#ff4d4f"); el.disabled = false; }

  }
}
async function dingSendSelected() {
  const rows = window._kehuRows || [];
  const oldNote = (TALK_CFG && TALK_CFG.periodRule && TALK_CFG.periodRule.oldNote) || "二转";
  // 如果有勾选，只发送选中的；否则发送全部可见的
  const selIds = dingSelectedIds();
  // send all visible non-blank rows that have a tutor and aren't already sent
  const targets = rows.filter(r => {
    if (r.is_blank || r.query_status === "blank") return false;
    const tutor = r.fill_tutor || r.src_tutor || "";
    if (!tutor) return false;
    const st = r.ding_status || "";
    if (st === "ok" || st === "sending") return false;
    if (selIds.length > 0 && !selIds.includes(r.id)) return false;
    return true;
  });
  if (!targets.length) { setMsg("当前页没有可发送的行", "#ff4d4f"); return; }
  const secondRows = targets.filter(r => (r.fill_tutor || r.src_tutor || "") === oldNote);
  const singleRows = targets.filter(r => (r.fill_tutor || r.src_tutor || "") !== oldNote);
  let msg = [];
  if (secondRows.length) {
    for (const row of secondRows) {
      try {
        const period = row.fill_period || row.src_period || "";
        const phone = row.fill_phone || row.src_phone || "";
        const problem = extractProblem(row.customer_info) || row.category;
        const talk = problem + " " + oldNote;
        const course = extractCourse(row.customer_info);
        let lines = [period, phone];
        if (course) lines.push(course);
        lines.push(talk);
        const text = "## 客诉转办\n\n" + lines.map(l => "- " + l).join("\n");
        await fetch("/api/send-dingtalk", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({text, id: row.id}) });
        _dingSent.add(row.id);
      } catch (e) {}
    }
    msg.push(secondRows.length + " 条二转已发群");
  }
  if (singleRows.length) {
    try {
      const singleIds = singleRows.map(r => r.id);
      await fetch("/api/ding/send", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ids:singleIds}) });
      msg.push(singleRows.length + " 条单聊已发送");
    } catch (e) { msg.push("单聊发送失败: " + e.message); }
  }
  setMsg(msg.join("；") || "无有效发送", "#1f6e43");
  startPoll();
}
