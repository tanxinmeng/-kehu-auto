<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>客诉内部处理表</title>
<style>
  :root { --ai:#2b579a; --gao:#c55a11; }
  * { box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",sans-serif; margin:0; background:#f5f6fa; color:#333; font-size:12px; }
  .top { background:linear-gradient(90deg,#2b579a,#1f3f6e); color:#fff; padding:10px 14px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .top h1 { font-size:17px; margin:0; }
  .stats { font-size:12px; display:flex; gap:10px; flex-wrap:wrap; }
  .stats b { color:#ffd966; }
  .syncbar { padding:8px 14px; background:#eef2fa; border-bottom:1px solid #d5dceb; display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-size:12px; }
  .syncbar .grp { display:flex; align-items:center; gap:5px; background:#fff; padding:4px 8px; border:1px solid #ccd4e6; border-radius:5px; }
  .syncbar input[type=number] { width:76px; padding:4px 5px; border:1px solid #bbb; border-radius:4px; }
  .syncbar button { padding:5px 12px; background:#2b579a; color:#fff; border:0; border-radius:4px; cursor:pointer; }
  .syncbar button.alt { background:#fff; color:#2b579a; border:1px solid #2b579a; }
  .dingbar { padding:6px 14px; background:#e8f5e9; border-bottom:1px solid #c8e6c9; display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-size:12px; }
  .dingbar .dgrp { display:flex; align-items:center; gap:5px; }
  .dingbar button { padding:4px 10px; border:1px solid #2b579a; border-radius:4px; cursor:pointer; font-size:11px; background:#fff; color:#2b579a; }
  .dingbar button.ding-out { border-color:#e67e22; color:#e67e22; }
  .dingbar button.ding-switch { border-color:#7f8c8d; color:#7f8c8d; }
  .dingbar label { font-size:11px; cursor:pointer; }
  .syncmsg { padding:4px 14px; font-size:12px; color:#1a6d1a; }
  .filters { padding:8px 14px; background:#fff; border-bottom:1px solid #e3e6ea; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .filters select,.filters input { padding:5px 7px; border:1px solid #ccc; border-radius:4px; font-size:12px; }
  .filters button { padding:5px 12px; background:#2b579a; color:#fff; border:0; border-radius:4px; cursor:pointer; font-size:12px; }
  .filters button.alt { background:#fff; color:#2b579a; border:1px solid #2b579a; }
  .pager { padding:6px 14px; font-size:12px; color:#888; }
  .pager button { margin-left:6px; }
  .wrap { padding:8px 14px; }
  table { width:100%; border-collapse:collapse; background:#fff; font-size:11.5px; table-layout:fixed; }
  th,td { border:1px solid #e3e6ea; padding:5px 4px; text-align:left; vertical-align:middle; overflow:hidden; }
  th { background:#eef1f7; position:sticky; top:0; z-index:2; white-space:nowrap; font-size:11.5px; }
  td.info { white-space:pre-line; line-height:1.4; font-size:11px; word-break:break-all; }
  td.cat { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  tr.special td { background:#fff7e6; }
  tr.not_found td { background:#fff6d8; }
  tr.not_found td.period { background:#fde9b3; font-weight:700; color:#8a6d00; }
  tr.filled td { background:#f2fbf2; }
  tr.srcfilled td { background:#e9f7ef; }
  .badge { display:inline-block; padding:1px 7px; border-radius:3px; color:#fff; font-size:11px; }
  .badge.ai { background:var(--ai); } .badge.gao { background:var(--gao); }
  .badge.src { background:#2e8b57; }
  .procbtn { padding:3px 10px; border:1px solid #bbb; border-radius:3px; font-size:12px; cursor:pointer; background:#fff; }
  .procbtn.yes { background:#2b579a; color:#fff; border-color:#2b579a; }
  .reqbtn { padding:3px 8px; border:1px solid #2b579a; border-radius:3px; font-size:11px; cursor:pointer; background:#fff; color:#2b579a; white-space:nowrap; }
  .reqbtn:hover { background:#2b579a; color:#fff; }
  .reqbtn:disabled { background:#eee; border-color:#ccc; color:#bbb; cursor:not-allowed; }
  .order { font-family:Consolas,monospace; font-size:10.5px; word-break:break-all; }
  .fb { width:100%; min-height:22px; border:1px solid transparent; border-radius:3px; font-size:11px; resize:none; background:transparent; font-family:inherit; }
  .fb:focus { border-color:#2b579a; background:#fff; outline:none; }
  .rmk { width:100%; padding:2px 3px; border:1px solid #ccc; border-radius:3px; font-size:11px; }
  .copyable { cursor:pointer; }
  .copyable:hover { background:#eef4ff; }
  .talkcell { cursor:pointer; }
  .talkcell:hover { background:#eef4ff; }
  .tk { white-space:pre-line; line-height:1.45; font-size:11px; word-break:break-all; }
  .tk .t-talk { color:#1a6d1a; }
  .talk-wrap { display:flex; align-items:flex-start; gap:5px; }
  .tkwrap { flex:1 1 auto; }
  .genbtn { flex:0 0 auto; padding:2px 7px; border:1px solid #bbb; border-radius:3px; background:#eee; color:#888; font-size:11px; cursor:pointer; white-space:nowrap; }
  .genbtn.on { background:#2e8b57; color:#fff; border-color:#2e8b57; }
	  .dingcell { font-size:11px; line-height:1.5; text-align:center; }
	  .dbtn { padding:3px 10px; border:1px solid #1677ff; border-radius:3px; background:#1677ff; color:#fff; font-size:11px; cursor:pointer; white-space:nowrap; }
	  .dbtn:hover { background:#0d62eb; }
	  .dbtn:disabled { background:#bbb; border-color:#bbb; color:#fff; cursor:not-allowed; }
	  .talkcell .dingbtn { display:none; }
	  .dingbtn { padding:2px 7px; border:1px solid #1677ff; border-radius:3px; background:#1677ff; color:#fff; font-size:10.5px; cursor:pointer; white-space:nowrap; }
	  .dingbtn:hover { background:#0d62eb; }
	  .dingbtn.sent { background:#bbb; border-color:#bbb; color:#fff; }
	  .delbtn { padding:0 5px; border:1px solid #e0e0e0; border-radius:3px; background:#fff; color:#c0392b; font-size:14px; font-weight:700; cursor:pointer; line-height:1.4; }
	  .delbtn:hover { background:#c0392b; color:#fff; border-color:#c0392b; }
	  .selbox { width:15px; height:15px; cursor:pointer; accent-color:#2b579a; }
	  .selbar { display:none; padding:6px 14px; background:#eef4ff; border-bottom:1px solid #c5d5f2; align-items:center; gap:8px; font-size:12px; }
	  .selbar.show { display:flex; }
	  .selbar button { padding:4px 10px; border:1px solid #2b579a; border-radius:4px; cursor:pointer; font-size:12px; background:#fff; color:#2b579a; }
	  .selbar button.primary { background:#2b579a; color:#fff; }
	  .selbar button.danger { border-color:#c0392b; color:#c0392b; }
	  .selbar .selcnt { font-weight:700; color:#2b579a; }
  .genbtn-all { padding:1px 6px; border:1px solid #bbb; border-radius:3px; background:#eee; color:#888; font-size:10.5px; cursor:pointer; margin-left:4px; vertical-align:middle; }
  .genbtn-all.on { background:#2e8b57; color:#fff; border-color:#2e8b57; }

  .footer { padding:6px 14px; color:#888; font-size:11.5px; }
  col.c-info { width:26%; } col.c-cat { width:8%; } col.c-fb { width:14%; }

  .toast { position:fixed; background:#22c55e; color:#fff; padding:6px 14px; border-radius:6px; font-size:13px; font-weight:600; z-index:9999; opacity:0; transition:opacity 0.2s; pointer-events:none; box-shadow:0 3px 12px rgba(34,197,94,0.4); white-space:nowrap; }
  .toast.show { opacity:1; }

</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="top">
  <h1>客诉内部处理表</h1>
  <div class="stats" id="stats"></div>
</div>
<div class="syncbar">
  <div class="grp"><span class="badge ai">AI表</span> 从第 <input type="number" id="aiStart" min="3" placeholder="如 10880"> 行及以下 <button id="btnSyncAI" onclick="doSync('AI')">同步并查询</button></div>
  <div class="grp"><span class="badge gao">高表</span> 从第 <input type="number" id="gaoStart" min="3" placeholder="如 2707"> 行及以下 <button id="btnSyncGao" onclick="doSync('高')">同步并查询</button></div>
  <div class="grp"><button class="alt" onclick="doQuery()">查询补全(当前表)</button></div>
  <div class="grp"><button class="alt" id="btnBatchAI" onclick="batchFill('AI')">批量回填(AI表)</button></div>
  <div class="grp"><button class="alt" id="btnBatchGao" onclick="batchFill('高')">批量回填(高表)</button></div>
  </div>
<div class="dingbar">
  <span id="dingStatus" style="font-size:11px;font-weight:600;">钉钉：加载中...</span>
  <div class="dgrp">
    <button onclick="dingLogin()">登录</button>
    <button onclick="dingLogout()" class="ding-out">退出</button>
    <button onclick="dingSwitchAccount()" class="ding-switch">切换账号</button>
  </div>
  <div class="dgrp">
    <button onclick="dingSendSelected()" style="background:transparent;color:#1677ff;border-color:#1677ff;">发送选中</button>
  </div>
  <label style="font-size:11px;cursor:pointer;"><input type="checkbox" id="dingAuto" onchange="dingAutoSave()"> 回填后自动发钉钉</label>
  <div class="dgrp" style="margin-left:12px;">
    <button class="alt" onclick="batchSendDingtalk()" title="批量发送所有二转话术到钉钉群">批量发送钉钉</button>
    <button class="alt" onclick="load(PAGE,true)">刷新列表</button>
    <button onclick="resetTable()" style="background:#c0392b;color:#fff;border-color:#c0392b;">重置</button>
  </div>
</div>
<div class="syncbar" style="background:#fff;border-top:none">
<div class="syncmsg" id="syncmsg"></div>
<div class="filters">
  <select id="fSheet"><option value="AI" selected>AI表</option><option value="高">高表</option></select>
  <select id="fStatus"><option value="">全部状态</option><option value="pending">待补全</option><option value="filled">已补全</option><option value="special">特殊单</option><option value="not_found">系统未掉落</option></select>
  <select id="fProcessed"><option value="">全部处理</option><option value="是">已处理(是)</option><option value="否">未处理</option></select>
  <input id="fQ" placeholder="搜索 订单号/内容/诉求">
  <button onclick="load(0)">查询</button>
  <span id="count" style="color:#888;font-size:12px"></span>
</div>
<div class="pager" id="pager"></div>
<div class="selbar" id="selbar"><span>已选 <span class="selcnt" id="selcnt">0</span> 条</span><button onclick="batchProcessSelected()" class="primary">标记已处理</button><button onclick="querySelected()">补全选中</button><button onclick="dingSendSelected()">批量发钉钉</button><button onclick="batchDeleteSelected()" class="danger">批量删除</button><button onclick="clearSelection()">取消选择</button></div>
<div class="wrap">
  <table>
    <colgroup>
      <col style="width:2%"><col style="width:3.5%"><col style="width:4.5%"><col style="width:5.5%"><col class="c-info"><col class="c-cat">
      <col style="width:5%"><col style="width:7%"><col style="width:7%"><col style="width:5.5%"><col style="width:9%"><col style="width:7%">
      <col style="width:5.5%"><col class="c-fb"><col style="width:5.5%"><col style="width:5.5%"><col style="width:2%">
    </colgroup>
    <thead><tr>
      <th><input type="checkbox" class="selbox" id="selAll" onclick="toggleSelectAll(this)" title="全选/取消全选"></th><th>表</th><th>源表行</th><th>反馈时间</th><th>客户信息及反馈</th><th>问题归类</th>
      <th>期次</th><th>手机号</th><th>顾问</th><th>是否处理</th><th>话术 <button id="genAllBtn" class="genbtn-all" onclick="toggleTalkGenAll(this)" title="批量生成/撤销全部话术">生成</button></th><th>处理时间</th><th>备注</th><th>顾问反馈</th><th>回写源表</th><th>钉钉</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<div class="footer">点"同步并查询"= 把源表该行号及以下的新数据拉进来并自动查询补全；黄色行=系统未掉落；绿色行=源表已填期次/手机号/顾问（默认已处理）。<span style="color:#2b579a;font-weight:700">（筛选修复版 v2）</span></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const CAT_COLORS = { "未收到通知":"#F88825","正价退费纠纷":"#F88825","投诉助教服务":"#F88825","更换通知方式":"#F88825","承诺资料未给":"#FF0000","用户主动添加不成功":"#8CDDFA" };
let PAGE = 0; const PAGE_SIZE = 300;
	const _dingSent = new Set(); // 已发送钉钉的行ID
let syncing = false;

	// ---------- 勾选框 / 批量选择 ----------
	function toggleSelectAll(el) {
	  document.querySelectorAll('.selbox').forEach(cb => { if (cb.id !== 'selAll') cb.checked = el.checked; });
	  updateSelBar();
	}
	function onSelChange() {
	  const all = document.querySelectorAll('.selbox:not(#selAll)');
	  const checked = document.querySelectorAll('.selbox:not(#selAll):checked');
	  const selAll = document.getElementById('selAll');
	  if (selAll) { selAll.checked = checked.length === all.length && all.length > 0; selAll.indeterminate = checked.length > 0 && checked.length < all.length; }
	  updateSelBar();
	}
	function updateSelBar() {
	  const ids = dingSelectedIds();
	  const bar = document.getElementById('selbar');
	  const cnt = document.getElementById('selcnt');
	  if (cnt) cnt.textContent = ids.length;
	  if (bar) bar.classList.toggle('show', ids.length > 0);
	}
	function clearSelection() {
	  document.querySelectorAll('.selbox:checked').forEach(cb => { cb.checked = false; });
	  const selAll = document.getElementById('selAll');
	  if (selAll) { selAll.checked = false; selAll.indeterminate = false; }
	  updateSelBar();
	}
	async function batchProcessSelected() {
	  const ids = dingSelectedIds();
	  if (!ids.length) { showToast('请先勾选记录', '#888'); return; }
	  if (!confirm('将 ' + ids.length + ' 条选中记录标记为"已处理"？')) return;
	  let ok = 0;
	  for (const id of ids) {
	    try {
	      await fetch('/api/process', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id, processed:'是'}) });
	      ok++;
	    } catch(e) {}
	  }
	  showToast('已标记 ' + ok + ' 条为已处理');
	  clearSelection();
	  load(PAGE, true);
	}
	async function batchDeleteSelected() {
	  const ids = dingSelectedIds();
	  if (!ids.length) { showToast('请先勾选记录', '#888'); return; }
	  if (!confirm('确定要删除 ' + ids.length + ' 条选中记录？此操作不可撤销。')) return;
	  try {
	    const r = await fetch('/api/delete-batch', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ids}) });
	    const d = await r.json();
	    showToast('已删除 ' + d.deleted + ' 条', d.deleted > 0 ? '#27ae60' : '#c0392b');
	  } catch(e) {
	    showToast('删除失败', '#c0392b');
	  }
	  clearSelection();
	  load(PAGE, true);
	}
	async function queryOne(el) {
	  const id = Number(el.dataset.id);
	  el.disabled = true;
	  try {
	    await fetch('/api/query-one', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id}) });
	    showToast('已提交补全', null, el);
	    setMsg('正在补全该行...（自动刷新中）', '#2b579a');
	    startPoll();
	  } catch(e) {
	    showToast('补全失败: ' + e.message, '#ef4444');
	    el.disabled = false;
	  }
	}
	async function querySelected() {
	  const ids = dingSelectedIds();
	  if (!ids.length) { showToast('请先勾选记录', '#888'); return; }
	  if (!confirm('将补全 ' + ids.length + ' 条选中记录？')) return;
	  try {
	    await fetch('/api/query-batch', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ids}) });
	    showToast('已提交补全 ' + ids.length + ' 条');
	    setMsg('正在补全 ' + ids.length + ' 条...（自动刷新中）', '#2b579a');
	    startPoll();
	    clearSelection();
	  } catch(e) {
	    showToast('补全失败: ' + e.message, '#ef4444');
	  }
	}

async function stats() {
  try {
    const d = await (await fetch("/api/stats")).json();
    const map = {}; d.status.forEach(s=>map[s.query_status]=s.n);
    const pmap = {}; d.processed.forEach(s=>pmap[s.processed]=s.n);
    const ss = d.syncState || {};
    let syncInfo = "";
    if (ss.AI && ss.AI.lastRow) syncInfo += ` | AI已同步到 ${ss.AI.lastRow} 行`;
    if (ss["高"] && ss["高"].lastRow) syncInfo += ` | 高已同步到 ${ss["高"].lastRow} 行`;
    $("stats").innerHTML = `共 <b>${d.total}</b> 条 | 待补全 <b>${map.pending||0}</b> | 已补全 <b>${map.filled||0}</b> | 特殊 <b>${map.special||0}</b> | 未掉落 <b>${map.not_found||0}</b> | 已处理 <b>${pmap["是"]||0}</b> | 钉钉已发 <b>${d.dingSent||0}</b> | 失败 <b>${d.dingFail||0}</b><span style="color:#cfe0ff">${syncInfo}</span>`;
  } catch(e){}
}
function qs() {
  const p = new URLSearchParams();
  if ($("fSheet").value) p.set("sheet", $("fSheet").value);
  if ($("fStatus").value) p.set("status", $("fStatus").value);
  if ($("fProcessed").value) p.set("processed", $("fProcessed").value);
  if ($("fQ").value.trim()) p.set("q", $("fQ").value.trim());
  p.set("limit", String(PAGE_SIZE)); p.set("offset", String(PAGE * PAGE_SIZE));
  const s = p.toString();
  return s;
}
let TALK_CFG = null;
async function loadTalkCfg() {
  try { const r = await fetch("/api/config", { cache: "no-store" }); TALK_CFG = await r.json(); } catch (e) { TALK_CFG = {}; }
}
function extractCourse(ci) {
  const lines = String(ci || "").split(/\n+/).map(s => s.trim()).filter(Boolean);
  const re = /(升初一|升初二|升初三|升高一|升高二|升高三|老梦|梦亚|果冻|清北|初一|初二|初三|高一|高二|高三|长期|短期|寒假|暑假|春季|秋季)/;
  const hit = lines.find(l => re.test(l) && !/^\d+$/.test(l) && !/\d{10,}/.test(l));
  return hit ? hit.replace(/\+$/, "").trim() : "";
}
function extractNewContact(ci) {
  const s = String(ci || "");
  const m = s.match(/更换通知方式\s*(\d{6,})/) || s.match(/通知\s*(\d{6,})/);
  return m ? m[1] : "";
}
function extractProblem(ci) {
  const lines = String(ci || "").split(/\n+/).map(s => s.trim()).filter(Boolean);
  const last = lines[lines.length - 1] || "";
  return last.replace(/\+$/, "").trim();
}
function talkBlock(row) {
  const st = row.query_status || "";
  const cat = row.category || "";
  const remark = row.query_remark || "";
  const period = row.fill_period || row.src_period || "";
  const phone = row.fill_phone || row.src_phone || "";
  const tutor = row.fill_tutor || row.src_tutor || "";
  const isNotFound = st === "not_found" || period === "系统未掉落";
  const isSpecial = st === "special" || remark.includes("爱芯过滤") || remark.includes("正价课拦截") || cat.includes("爱芯过滤") || cat.includes("正价课拦截");
  // 无具体助教（未掉落/过滤/正价课拦截/空助教）或缺期次/电话 → 不需要话术
  if (isNotFound || isSpecial || !tutor || !period || !phone) return "";
  const course = extractCourse(row.customer_info);
  const oldNote = (TALK_CFG && TALK_CFG.periodRule && TALK_CFG.periodRule.oldNote) || "二转";
  const isSecond = tutor === oldNote;
  const tmpl = (TALK_CFG && TALK_CFG.talkScripts || {})[cat];
  let periodLine = period;
  let talk;
  if (isSecond) {
    // 二转话术 = 客户信息里客服提交的具体问题 + 空格 + 二转（如：未收到通知 二转）
    const problem = extractProblem(row.customer_info) || cat;
    talk = problem + " " + oldNote;
  } else if (tmpl) {
    let newContact = extractNewContact(row.customer_info);
    // 更换联系方式类：客服给的新电话与登记电话一致（或没给新号）→ 期次行标注（电话无误）
    if ((cat === "更换通知方式" || cat === "更换联系方式") && (!newContact || newContact === phone)) {
      periodLine = period + "（电话无误）";
      newContact = phone;
    }
    talk = String(tmpl)
      .replace(/\{期次\}/g, period)
      .replace(/\{电话\}/g, phone)
      .replace(/\{手机号\}/g, phone)
      .replace(/\{课程\}/g, course)
      .replace(/\{新联系方式\}/g, newContact);
  } else {
    return "";  // 少见分类无模板 → 留空，人工处理
  }
  // 期次/电话/话术 必有；课程缺失则省略课程行
  let html = esc(periodLine) + '<br>' + esc(phone);
  if (course) html += '<br>' + esc(course);
  html += '<br><span class="t-talk">' + esc(talk) + '</span>';
  return '<div class="tk">' + html + '</div>';
}

function copyText(text, el) {
  var ta = document.createElement("textarea");
  ta.value = text;

// 自动刷新轮询：同步/查询/回写进行中每5秒刷新一次列表，完成后显示"已完成"
async function pollStatus() {
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    const d = await r.json();
    const filled = d.filled || 0, total = d.total || 0, pending = d.pending || 0;
    const records = d.records || total;                       // 只算真实记录，不算空白占位行
    const blanks = Math.max(0, total - records);
    if (d.running) {
      quietPoll = 0;
      if (d.type && d.type.indexOf("钉钉") >= 0) {
        const dp = d.dingProgress;
        if (dp && dp.total > 0) {
          setMsg(d.type + " 进行中… 已发送 " + Math.min(dp.done || 0, dp.total) + "/" + dp.total + "（自动刷新中）", "#2b579a");
        } else {
          setMsg(d.type + " 进行中…（自动刷新中）", "#2b579a");
        }
      } else {
        setMsg((d.type || "任务") + " 进行中… 已补全 " + filled + "/" + records + (blanks ? "（另有 " + blanks + " 行空白）" : "") + "（自动刷新中）", "#2b579a");
      }
      load(PAGE, true);
    } else {
      quietPoll++;
      if (quietPoll >= 2) {
        if (d.type && d.type.indexOf("钉钉") >= 0) {
          setMsg("已完成：" + d.type, "#1a6d1a");
        } else {
          setMsg("已完成：" + (d.type || "任务") + "，已补全 " + filled + "/" + records + (blanks ? "（另有 " + blanks + " 行空白）" : "") + "，待补全 " + pending, "#1a6d1a");
        }
        load(PAGE, true);
        stopPoll();
        syncing = false; $("btnSyncAI").disabled = false; $("btnSyncGao").disabled = false;
      } else {
        load(PAGE, true);
      }
    }
  } catch (e) {}
}

  if ($("btnBatchGao")) $("btnBatchGao").disabled = false;
}
async function pollBatchResult(sheet, phase) {
  const label = phase === "exec" ? "批量回填" : "批量检查";
  let elapsed = 0;
  for (let i = 0; i < 60; i++) {
    await new Promise(r => setTimeout(r, 3000)); elapsed += 3;
    try {
      const sr = await fetch("/api/status");
      const st = await sr.json();
      if (st.lastPhase !== phase) continue; // 不是我们的结果
      if (st.running) {
        setMsg(label + "进行中...（已等待 " + elapsed + " 秒）", "#2b579a");
        continue;
      }
      // 任务完成
      const res = st.lastResult;
      if (!res) { setMsg(label + "完成但无结果", "#c0392b"); syncing = false; enableBtns(); return; }
      if (phase === "check") {
        if (res.ok) {
          setMsg("核对通过：顶" + res.top + " / 中" + res.middle + " / 底" + res.bottom + " 行号与订单号均与源表一致（共 " + res.N + " 条记录）", "#1a6d1a");
          if (confirm("核对通过：第 " + res.top + " - " + res.bottom + " 行（共 " + res.N + " 条记录），起始/最底/中间行的行号与订单号与源表一致。\n\n是否执行批量回填？将把网页的期次/电话/助教整体覆盖到源表对应行。\n选'是'执行，选'否'取消。")) {
            syncing = false; enableBtns();
            await batchFillExec(sheet);
            return;
          } else {
            setMsg("已取消批量回填", "#888");
          }
        } else {
          setMsg("批量检查失败：" + (res.reason || "未知错误"), "#c0392b");
        }
      } else {
        if (res.ok) {
          setMsg("批量回填成功：已写入 " + (res.written || 0) + " 条记录（第" + res.top + "-" + res.bottom + " 行），末尾校验通过", "#1a6d1a");
          load(0, true);
          startPoll();
        } else {
          setMsg("批量回填" + (res.rolledBack ? "失败但已撤销粘贴" : "未执行") + "：" + (res.reason || "未知原因"), "#c0392b");
        }
      }
      syncing = false; enableBtns();
      return;
    } catch (e) { /* 轮询失败，继续 */ }
  }
  setMsg(label + "超时（3分钟未完成），请刷新页面查看状态", "#c0392b");
  syncing = false; enableBtns();
}
async function batchFillExec(sheet) {
  syncing = true;
  $("btnSyncAI").disabled = true; $("btnSyncGao").disabled = true;
  if ($("btnBatchAI")) $("btnBatchAI").disabled = true;
  if ($("btnBatchGao")) $("btnBatchGao").disabled = true;
  setMsg((sheet === "AI" ? "AI表" : "高表") + " 批量回填执行中（粘贴+末尾校验，约需 60-90 秒）...", "#2b579a");
  try {
    const r = await fetch("/api/writeback-all", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({sheet, phase:"exec"}) });
    const d = await r.json();
    if (!d.async) { setMsg("批量回填启动失败：" + (d.reason || "未知"), "#c0392b"); syncing = false; enableBtns(); return; }
    await pollBatchResult(sheet, "exec");
  } catch (e) {
    setMsg("批量回填请求失败: " + e.message, "#c0392b");
    syncing = false; enableBtns();
  }
}

  else el.innerHTML = '钉钉：<span style="color:#e67e22">未登录</span>';

}

function dingSelectedIds() { return [...document.querySelectorAll(".selbox:checked")].map(x => Number(x.dataset.id)).filter(n => n > 0); }
function dingBadge(row) {
  const s = row.ding_status || "";
  const at = row.ding_at ? '<div style="font-size:10px;color:#aaa">' + esc(row.ding_at) + '</div>' : "";
  const msg = row.ding_msg ? ' title="' + esc(row.ding_msg) + '"' : "";
  const map = {
    "": '<span style="color:#bbb">未发</span>',
    "ok": '<span style="color:#1a6d1a;font-weight:700"' + msg + '>已发送</span>',
    "fail": '<span style="color:#c0392b;font-weight:700;cursor:help"' + msg + '>失败</span>',
    "skip": '<span style="color:#999"' + msg + '>跳过</span>',
    "sending": '<span style="color:#2b579a">发送中…</span>'
  };
  return (map[s] || esc(s)) + at;
}
async function dingSendOne(el) {
  const id = Number(el.dataset.id);
  const rows = window._kehuRows || [];
  const row = rows.find(r => r.id === id);
  if (!row) return;
  const tutor = row.fill_tutor || row.src_tutor || "";
  const oldNote = (TALK_CFG && TALK_CFG.periodRule && TALK_CFG.periodRule.oldNote) || "二转";
  const isSecond = tutor === oldNote;
  el.disabled = true;
  if (isSecond) {
    setMsg("正在发送二转群消息...", "#2b579a");
    try {
      const period = row.fill_period || row.src_period || "";
      const phone = row.fill_phone || row.src_phone || "";
      const problem = extractProblem(row.customer_info) || row.category;
      const talk = problem + " " + oldNote;
      const course = extractCourse(row.customer_info);
      let lines = [period, phone];
      if (course) lines.push(course);
      lines.push(talk);
      const text = "## 客诉转办\n\n" + lines.map(l => "- " + l).join("\n");
      const r2 = await fetch("/api/send-dingtalk", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({text, id}) });
      const d2 = await r2.json();
      if (d2.ok) { _dingSent.add(id); showToast("已发送到群"); }
      else { showToast("发送失败: " + (d2.error || "未知"), "#ef4444"); el.disabled = false; }
    } catch (e) { showToast("发送失败: " + e.message, "#ef4444"); el.disabled = false; }
  } else {
    if (!DING_CFG.available) { setMsg("未安装 dws，请先安装", "#c0392b"); el.disabled = false; return; }
    setMsg("正在发送钉钉消息...", "#2b579a");
    try {
      const r2 = await fetch("/api/ding/send", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ids:[id]}) });
      const d2 = await r2.json();
      setMsg(d2.message || "已加入发送队列", "#1a6d1a");
    } catch (e) { setMsg("发送请求失败: " + e.message, "#c0392b"); el.disabled = false; }
    startPoll();
  }
}
async function dingSendSelected() {
  const rows = window._kehuRows || [];
  const oldNote = (TALK_CFG && TALK_CFG.periodRule && TALK_CFG.periodRule.oldNote) || "二转";
  // 如果有勾选，只发送选中的；否则发送全部可见的
  const selIds = dingSelectedIds();
  // send all visible non-blank rows that have a tutor and aren't already sent
  const targets = rows.filter(r => {
    if (r.is_blank || r.query_status === "blank") return false;
    const tutor = r.fill_tutor || r.src_tutor || "";
    if (!tutor) return false;
    const st = r.ding_status || "";
    if (st === "ok" || st === "sending") return false;
    if (selIds.length > 0 && !selIds.includes(r.id)) return false;
    return true;
  });
  if (!targets.length) { setMsg("当前页没有可发送的行", "#c0392b"); return; }
  const secondRows = targets.filter(r => (r.fill_tutor || r.src_tutor || "") === oldNote);
  const singleRows = targets.filter(r => (r.fill_tutor || r.src_tutor || "") !== oldNote);
  let msg = [];
  if (secondRows.length) {
    for (const row of secondRows) {
      try {
        const period = row.fill_period || row.src_period || "";
        const phone = row.fill_phone || row.src_phone || "";
        const problem = extractProblem(row.customer_info) || row.category;
        const talk = problem + " " + oldNote;
        const course = extractCourse(row.customer_info);
        let lines = [period, phone];
        if (course) lines.push(course);
        lines.push(talk);
        const text = "## 客诉转办\n\n" + lines.map(l => "- " + l).join("\n");
        await fetch("/api/send-dingtalk", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({text, id: row.id}) });
        _dingSent.add(row.id);
      } catch (e) {}
    }
    msg.push(secondRows.length + " 条二转已发群");
  }
  if (singleRows.length) {
    try {
      const singleIds = singleRows.map(r => r.id);
      await fetch("/api/ding/send", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ids:singleIds}) });
      msg.push(singleRows.length + " 条单聊已发送");
    } catch (e) { msg.push("单聊发送失败: " + e.message); }
  }
  setMsg(msg.join("；") || "无有效发送", "#1a6d1a");
  startPoll();
}

}
